<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure File Sharing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Secure File Sharing System</h1>
        <p>Upload, manage and share your files securely.</p>
    </header>

    <main>
        <section id="authSection">
    <h2>Secure File Sharing System</h2>

    <h3>Register</h3>
    <form id="registerForm">
        <input id="registerName" type="text"
            placeholder="Your name" required>

        <input id="registerEmail" type="email"
            placeholder="Email address" required>

        <input id="registerPassword" type="password"
            placeholder="Password (minimum 8 characters)"
            minlength="8" required>

        <button type="submit">Register</button>
    </form>

    <hr>

    <h3>Login</h3>
    <form id="loginForm">
        <input id="loginEmail" type="email"
            placeholder="Email address" required>

        <input id="loginPassword" type="password"
            placeholder="Password" required>

        <button type="submit">Login</button>
    </form>

    <p id="authMessage" role="status"></p>
</section>

        <section class="welcome" id="welcomeSection" hidden>
            <h2>Welcome!</h2>
            <p>Your personal space for secure file sharing.</p>
            <button id="getStartedBtn">Get Started</button>
            <button type="button" id="logoutBtn">Logout</button>
        </section>

        <section class="upload-section" id="uploadSection" hidden>
            <h2>Upload Your File</h2>
            <p>Select a JPG, PNG, PDF, or TXT file (maximum 5 MB).</p>

            <form id="uploadForm">
                <label for="fileInput">Choose a file:</label>
                <input
                    type="file"
                    id="fileInput"
                    name="file"
                    accept=".jpg,.jpeg,.png,.pdf,.txt"
                    required
                >

                <button type="submit" id="uploadBtn">Upload File</button>
            </form>

            <p id="uploadMessage" role="status" aria-live="polite"></p>
        </section>

    <section class="my-files-section" id="myFilesSection" hidden>
    <h2>My Files</h2>
    <input
    type="text"
    id="searchFilesInput"
    placeholder="🔍 Search files by name..."
    aria-label="Search files by name">

    <button type="button" id="clearSearchBtn">Clear Search</button>
<select id="fileTypeFilter" aria-label="Filter files by type">
    <option value="all">All Files</option>
    <option value="image">Images</option>
    <option value="pdf">PDF Files</option>
    <option value="text">Text Files</option>
</select>

    <p id="fileCount">Total files: 0</p>
    <button type="button" id="loadFilesBtn">Refresh Files</button>
    <ul id="fileList"></ul>
    <p id="filesMessage" role="status"></p>
   </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
